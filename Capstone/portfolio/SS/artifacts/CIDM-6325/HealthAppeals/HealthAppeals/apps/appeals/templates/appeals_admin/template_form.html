{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<h1 class="mb-4">{{ title }}</h1>

<div class="card shadow-sm">
    <div class="card-body">
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="btn btn-success">Save</button>
            <a href="{% url 'appeals:admin_template_list' %}" class="btn btn-secondary ms-2">
                Cancel
            </a>
        </form>
    </div>
</div>

{% endblock %}
